name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  SWA_NAME: Zephyr

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    environment: prod
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
        
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure
        id: deploy
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          template-file: ./main.bicep
          parameters: |
            swaName: ${{ env.SWA_NAME }}
            functionAppEnvironment: "${{ github.event.pull_request.number || 'prod' }}"
        
      - name: Set up .NET version
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Prepare Visitors API for deployment
        run: dotnet publish ./backend/Zephyr.Visitors --configuration Release --output ./output
      - name: Deploy Visitors Azure Function
        uses: azure/functions-action@v1
        with:
          app-name: ${{ steps.deploy.outputs.functionAppName }}
          package: ./output

      - name: Get SWA token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$SWA_NAME" \
            --query properties.apiKey \
            --output tsv)
          
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./frontend" # App source code path
          api_location: "./backend/Zephyr.Weather" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          VITE_VISITORS_API_BASE_URL: 'https://${{ steps.deploy.outputs.functionAppDomain }}'

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: prod
    name: Close Pull Request Job
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Get SWA token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$SWA_NAME" \
            --query properties.apiKey \
            --output tsv)
          
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: "close"
      - name: Remove Azure Function App
        run: |
          FUNCTION_APP_NAME=$(az functionapp list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?tags.environment=='${{ github.event.pull_request.number }}'].name" \
            --output tsv)
          az functionapp delete \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name $FUNCTION_APP_NAME

          az functionapp plan delete \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name "zephyr-flex-plan-${{ github.event.pull_request.number }}"
            --yes

          STORAGE_ACCOUNT=$(az storage account list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?tags.role=='functionapp-storage'].name" \
            --output tsv)
          az storage container delete \
            --account-name $STORAGE_ACCOUNT \
            --name "zephyr-function-deployments-${{ github.event.pull_request.number }}" \
            --auth-mode login
